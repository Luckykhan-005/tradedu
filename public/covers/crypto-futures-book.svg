<!-- bottom meta -->
<text x="300" y="820" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.5" fill="#8b8571">31 CHAPTERS · 8 PARTS</text>
<text x="300" y="845" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.5" fill="#8b8571">ROMAN URDU EDITION</text>
</svg>

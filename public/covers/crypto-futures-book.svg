<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&amp;family=Newsreader:ital,wght@1,400&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
    .display{font-family:'Fraunces',Georgia,'Times New Roman',serif;}
    .body{font-family:'Newsreader',Georgia,serif;}
    .mono{font-family:'IBM Plex Mono',Menlo,monospace;}
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#12181f"/>
    <stop offset="100%" stop-color="#0c1116"/>
  </linearGradient>
</defs>

<rect width="600" height="900" fill="url(#bg)"/>

<!-- outer frame -->
<rect x="26" y="26" width="548" height="848" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.55"/>
<!-- corner ticks -->
<g stroke="#e0c168" stroke-width="1.5">
  <path d="M26,58 L26,26 L58,26" fill="none"/>
  <path d="M542,26 L574,26 L574,58" fill="none"/>
  <path d="M574,842 L574,874 L542,874" fill="none"/>
  <path d="M58,874 L26,874 L26,842" fill="none"/>
</g>

<!-- eyebrow -->
<text x="300" y="118" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#c9a227">EK MUKAMMAL REHNUMA KITAB</text>
<line x1="255" y1="136" x2="345" y2="136" stroke="#5a5138" stroke-width="1"/>

<!-- title -->
<text x="300" y="352" text-anchor="middle" class="display" font-weight="700" font-size="66" letter-spacing="1" fill="#ece7da">CRYPTO</text>
<text x="300" y="424" text-anchor="middle" class="display" font-weight="700" font-size="66" letter-spacing="1" fill="#ece7da">FUTURES</text>
<text x="300" y="496" text-anchor="middle" class="display" font-weight="700" font-size="66" letter-spacing="1" fill="#e0c168">TRADING</text>

<!-- ornament divider -->
<line x1="220" y1="534" x2="280" y2="534" stroke="#c9a227" stroke-width="1"/>
<circle cx="300" cy="534" r="4" fill="#c9a227"/>
<line x1="320" y1="534" x2="380" y2="534" stroke="#c9a227" stroke-width="1"/>

<!-- subtitle -->
<text x="300" y="576" text-anchor="middle" class="display" font-style="italic" font-weight="500" font-size="26" fill="#b9b3a3">Zero se Professional Tak</text>

<!-- decorative candlestick band -->
<g opacity="0.92">
  <line x1="80" y1="770" x2="520" y2="770" stroke="#2a323d" stroke-width="1"/>
  <!-- wicks + bars -->
  <g stroke-width="1.5">
    <line x1="102" y1="685" x2="102" y2="775" stroke="#5fa17d"/><rect x="90" y="695" width="24" height="65" fill="#5fa17d"/>

    <line x1="198" y1="665" x2="198" y2="775" stroke="#5fa17d"/><rect x="186" y="675" width="24" height="85" fill="#5fa17d"/>
    <line x1="230" y1="655" x2="230" y2="775" stroke="#c9a227"/><rect x="218" y="665" width="24" height="95" fill="#c9a227"/>
    <line x1="262" y1="670" x2="262" y2="775" stroke="#b5573c"/><rect x="250" y="680" width="24" height="80" fill="#b5573c"/>
    <line x1="294" y1="635" x2="294" y2="775" stroke="#5fa17d"/><rect x="282" y="645" width="24" height="115" fill="#5fa17d"/>
    <line x1="326" y1="640" x2="326" y2="775" stroke="#c9a227"/><rect x="314" y="650" width="24" height="110" fill="#c9a227"/>
    <line x1="358" y1="610" x2="358" y2="775" stroke="#5fa17d"/><rect x="346" y="620" width="24" height="140" fill="#5fa17d"/>
    <line x1="390" y1="620" x2="390" y2="775" stroke="#b5573c"/><rect x="378" y="630" width="24" height="130" fill="#b5573c"/>
    <line x1="422" y1="590" x2="422" y2="775" stroke="#c9a227"/><rect x="410" y="600" width="24" height="160" fill="#c9a227"/>
    <line x1="454" y1="575" x2="454" y2="775" stroke="#5fa17d"/><rect x="442" y="585" width="24" height="175" fill="#5fa17d"/>
    <line x1="486" y1="580" x2="486" y2="775" stroke="#c9a227"/><rect x="474" y="590" width="24" height="170" fill="#c9a227"/>
  </g>

<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web 3.0 — Scratch se Advanced Tak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --shell-bg:#10182B;
    --shell-bg-2:#1B2440;
    --shell-line:rgba(255,255,255,0.09);
    --page-bg:#F6F1E4;
    --page-bg-2:#EFE6CF;
    --ink:#2A2318;
    --ink-soft:#5B4F3A;
    --muted-on-dark:#A9B0C4;
    --brass:#C89B4A;
    --brass-soft:#E4C989;
    --teal:#2F8C7D;
    --line:rgba(42,35,24,0.16);
    --font-serif:"Spectral", Georgia, "Times New Roman", serif;
    --font-sans:"Space Grotesk", -apple-system, "Segoe UI", sans-serif;
    --font-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --shell-bg:#10182B; --shell-bg-2:#1B2440; --shell-line:rgba(255,255,255,0.09);
      --page-bg:#F6F1E4; --page-bg-2:#EFE6CF; --ink:#2A2318; --ink-soft:#5B4F3A;
      --muted-on-dark:#A9B0C4; --brass:#C89B4A; --brass-soft:#E4C989; --teal:#2F8C7D; --line:rgba(42,35,24,0.16);
    }
  }
  :root[data-theme="dark"]{
    --shell-bg:#10182B; --shell-bg-2:#1B2440; --shell-line:rgba(255,255,255,0.09);
    --page-bg:#F6F1E4; --page-bg-2:#EFE6CF; --ink:#2A2318; --ink-soft:#5B4F3A;
    --muted-on-dark:#A9B0C4; --brass:#C89B4A; --brass-soft:#E4C989; --teal:#2F8C7D; --line:rgba(42,35,24,0.16);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--shell-bg);
    color:var(--ink);
    font-family:var(--font-serif);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  .shell{
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }

  /* ---------- Sidebar / spine ---------- */
  .spine{
    width:300px;
    flex-shrink:0;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 26px),
      linear-gradient(180deg, var(--shell-bg-2), var(--shell-bg) 60%);
    color:var(--muted-on-dark);
    padding:28px 22px 22px 22px;
    padding-top:calc(28px + env(safe-area-inset-top,0px));
    border-right:1px solid var(--shell-line);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    height:100dvh;
    overflow-y:auto;
  }
  .spine::-webkit-scrollbar{width:8px;}
  .spine::-webkit-scrollbar-thumb{background:var(--shell-line); border-radius:4px;}

  .book-mark{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .book-mark .glyph{
    font-size:22px;
    line-height:1;
  }
  .book-title{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:20px;
    color:#F2EEDF;
    letter-spacing:0.2px;
  }
  .book-sub{
    font-family:var(--font-sans);
    font-size:12.5px;
    color:var(--muted-on-dark);
    margin:2px 0 22px 0;
  }

  .progress-wrap{
    margin-bottom:22px;
  }
  .progress-label{
    font-family:var(--font-sans);
    font-size:11.5px;
    color:var(--muted-on-dark);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .progress-track{
    height:4px;
    background:var(--shell-line);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--brass), var(--brass-soft));
    border-radius:2px;
  }

  .toc{
    flex:1;
  }
  .part-heading{
    font-family:var(--font-sans);
    font-size:12.5px;
    font-weight:600;
    color:var(--brass-soft);
    margin:20px 0 8px 0;
  }
  .part-heading:first-child{margin-top:0;}
  .chapter-link{
    display:flex;
    gap:10px;
    align-items:baseline;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:8px 8px;
    margin:0 -8px;
    border-radius:5px;
    color:var(--muted-on-dark);
    font-family:var(--font-sans);
    font-size:13.5px;
    line-height:1.4;
    cursor:pointer;
  }
  .chapter-link:hover{background:rgba(255,255,255,0.05); color:#EFE9D8;}
  .chapter-link .num{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--brass);
    flex-shrink:0;
    width:20px;
  }
  .chapter-link.locked .num{color:var(--muted-on-dark); opacity:0.6;}
  .chapter-link.locked{color:var(--muted-on-dark); opacity:0.55;}
  .chapter-link.active{
    background:rgba(200,155,74,0.14);
    color:#F6F1E4;
  }
  .chapter-link.active .num{color:var(--brass-soft);}

  .spine-foot{
    font-family:var(--font-sans);
    font-size:11px;
    color:var(--muted-on-dark);
    opacity:0.7;
    padding-top:16px;
    border-top:1px solid var(--shell-line);
    margin-top:16px;
  }

  /* ---------- Main page ---------- */
  .main{
    flex:1 1 auto;
    min-width:0;
    display:flex;
    justify-content:center;
    padding:56px 32px 90px 32px;
    background:var(--page-bg);
  }
  .page{
    width:100%;
    max-width:760px;
    color:var(--ink);
  }

  .topbar{
    display:none;
    position:sticky;
    top:0;
    z-index:20;
    align-items:center;
    gap:12px;
    background:var(--shell-bg);
    color:#F2EEDF;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    border-bottom:1px solid var(--shell-line);
  }
  .menu-btn{
    background:none;
    border:1px solid var(--shell-line);
    color:#F2EEDF;
    width:36px;
    height:36px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
  }
  .topbar-title{
    font-family:var(--font-sans);
    font-size:14px;
    color:var(--muted-on-dark);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:15;
  }

  .chip{
    display:inline-block;
    font-family:var(--font-sans);
    font-size:12px;
    color:var(--teal);
    background:rgba(47,140,125,0.1);
    border:1px solid rgba(47,140,125,0.35);
    padding:4px 10px;
    border-radius:20px;
    margin-bottom:22px;
  }

  .chapter-head{
    display:flex;
    gap:18px;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .chapter-num{
    font-family:var(--font-serif);
    font-weight:300;
    font-size:64px;
    line-height:1;
    color:var(--brass);
  }
  .chapter-titles h1{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:32px;
    line-height:1.25;
    margin:4px 0 6px 0;
    color:var(--ink);
  }
  .chapter-titles .kicker{
    font-family:var(--font-sans);
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .rule{
    border:none;
    border-top:1px solid var(--line);
    margin:26px 0;
  }

  article.chapter h2{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:22px;
    color:var(--ink);
    margin:38px 0 12px 0;
  }
  article.chapter h3{
    font-family:var(--font-serif);
    font-weight:600;
    font-size:17.5px;
    color:var(--ink);
    margin:22px 0 8px 0;
  }
  article.chapter p{
    font-size:16.5px;
    line-height:1.75;
    color:var(--ink);
    margin:0 0 16px 0;
  }
  article.chapter ul, article.chapter ol{
    margin:0 0 18px 0;
    padding-left:22px;
  }
  article.chapter li{
    font-size:16px;
    line-height:1.7;
    margin-bottom:7px;
  }
  article.chapter strong{color:var(--ink); font-weight:600;}

  .box{
    background:var(--page-bg-2);
    border-left:3px solid var(--brass);
    border-radius:4px;
    padding:18px 20px;
    margin:22px 0;
  }
  .box.khulasa{border-left-color:var(--teal);}
  .box-label{
    font-family:var(--font-sans);
    font-weight:600;
    font-size:12.5px;
    color:var(--brass);
    margin-bottom:8px;
  }
  .box.khulasa .box-label{color:var(--teal);}
  .box p, .box li{margin-bottom:8px;}
  .box ul{margin-bottom:0;}

  .diagram{
    margin:26px 0;
    padding:18px 10px 8px 10px;
    background:var(--page-bg-2);
    border:1px solid var(--line);
    border-radius:6px;
  }
  .diagram svg{width:100%; height:auto; display:block;}
  .diagram-cap{
    text-align:center;
    font-family:var(--font-sans);
    font-size:12px;
    color:var(--ink-soft);
    padding:10px 6px 2px 6px;
  }
  .diagram text.d-title{font-family:var(--font-serif); font-weight:600; fill:var(--ink);}
  .diagram text.d-sub{font-family:var(--font-sans); fill:var(--ink-soft);}
  .diagram text.d-tag{font-family:var(--font-sans); font-weight:600; fill:var(--ink-soft);}

  .era-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:22px 0 26px 0;
  }
  .era-card{
    background:var(--page-bg-2);
    border-radius:6px;
    padding:16px 16px 14px 16px;
    border-top:3px solid var(--line);
  }
  .era-card.w1{border-top-color:#9C8C6A;}
  .era-card.w2{border-top-color:var(--teal);}
  .era-card.w3{border-top-color:var(--brass);}
  .era-card h4{
    font-family:var(--font-serif);
    font-size:16px;
    font-weight:600;
    margin:0 0 3px 0;
    color:var(--ink);
  }
  .era-card .yrs{
    font-family:var(--font-sans);
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .era-card ul{padding-left:16px; margin:0;}
  .era-card li{
    font-size:13.5px;
    line-height:1.55;
    margin-bottom:6px;
  }

  .next-up{
    margin-top:46px;
    padding-top:22px;
    border-top:1px solid var(--line);
    font-family:var(--font-sans);
  }
  .next-up .lbl{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .next-up .nx{font-family:var(--font-serif); font-size:19px; font-weight:600;}

  .book-complete{
    margin-top:46px;
    padding:32px 28px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .book-complete .glyph{font-size:34px; margin-bottom:10px;}
  .book-complete h3{
    font-family:var(--font-serif);
    font-size:22px;
    font-weight:600;
    margin:0 0 10px 0;
  }
  .book-complete p{
    font-family:var(--font-sans);
    font-size:14px;
    color:var(--ink-soft);
    max-width:480px;
    margin:0 auto;
    line-height:1.6;
  }

  .code-block{
    background:var(--shell-bg-2);
    border:1px solid var(--shell-line);
    border-radius:8px;
    padding:18px 20px;
    margin:22px 0;
    overflow-x:auto;
  }
  .code-block pre{
    margin:0;
    font-family:var(--font-mono);
    font-size:12.5px;
    line-height:1.7;
    color:#DCE3F2;
    white-space:pre;
  }
  .code-block .cm{color:var(--muted-on-dark);}
  .code-block .kw{color:var(--brass-soft);}
  .code-block .ty{color:var(--teal);}
  .code-cap{
    font-family:var(--font-sans);
    font-size:12px;
    color:var(--ink-soft);
    margin:-14px 0 22px 0;
  }

  .placeholder-view{
    padding:60px 0;
    text-align:center;
  }
  .placeholder-view .pnum{
    font-family:var(--font-serif);
    font-weight:300;
    font-size:56px;
    color:var(--line);
  }
  .placeholder-view h1{
    font-family:var(--font-serif);
    font-size:26px;
    margin:10px 0 12px 0;
  }
  .placeholder-view p{
    font-family:var(--font-sans);
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:420px;
    margin:0 auto;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  @media (max-width: 860px){
    .spine{
      position:fixed;
      z-index:30;
      top:0; left:0; bottom:0;
      height:100dvh;
      transform:translateX(-100%);
      transition:transform 0.25s ease;
      box-shadow:2px 0 24px rgba(0,0,0,0.35);
    }
    .spine.open{transform:translateX(0);}
    .overlay.open{display:block;}
    .topbar{display:flex;}
    .main{padding:30px 18px 70px 18px;}
    .chapter-num{font-size:46px;}
    .chapter-titles h1{font-size:24px;}
    .era-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="shell">
  <nav class="spine" id="spine">
    <div class="book-mark">
      <span class="glyph">⛓️</span>
      <span class="book-title">Web 3.0</span>
    </div>
    <div class="book-sub">Scratch se Advanced Tak — Roman Urdu Kitaab</div>

    <div class="progress-wrap">
      <div class="progress-label"><span id="progress-text">1 / 23 chapters</span><span>mukammal</span></div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="toc" id="toc"></div>

    <div class="spine-foot">Har chapter mein examples, diagrams aur SVGs shamil hain.</div>
  </nav>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Chapters ki list kholain">☰</button>
      <div class="topbar-title" id="topbarTitle">Web 3.0 — Kitaab</div>
    </div>

    <div class="main">
      <div class="page" id="page"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var CHAPTERS = [
    {id:1, part:"Hissa 1 — Bunyad", title:"Introduction: Web 1.0 se Web 3.0 tak ka safar", ready:true},
    {id:2, part:"Hissa 1 — Bunyad", title:"Decentralization ka concept", ready:true},
    {id:3, part:"Hissa 1 — Bunyad", title:"Blockchain ki bunyad", ready:true},
    {id:4, part:"Hissa 1 — Bunyad", title:"Cryptography basics", ready:true},
    {id:5, part:"Hissa 1 — Bunyad", title:"Crypto wallets", ready:true},
    {id:6, part:"Hissa 2 — Core Technology", title:"Consensus mechanisms", ready:true},
    {id:7, part:"Hissa 2 — Core Technology", title:"Smart Contracts", ready:true},
    {id:8, part:"Hissa 2 — Core Technology", title:"Tokens aur Standards", ready:true},
    {id:9, part:"Hissa 2 — Core Technology", title:"Gas fees aur transactions", ready:true},
    {id:10, part:"Hissa 3 — DApps aur Development", title:"Decentralized Applications (DApps)", ready:true},
    {id:11, part:"Hissa 3 — DApps aur Development", title:"Web3 Development Stack", ready:true},
    {id:12, part:"Hissa 3 — DApps aur Development", title:"IPFS aur decentralized storage", ready:true},
    {id:13, part:"Hissa 3 — DApps aur Development", title:"Oracles — Chainlink", ready:true},
    {id:14, part:"Hissa 4 — Advanced Topics", title:"DeFi — DEXs, AMMs, liquidity", ready:true},
    {id:15, part:"Hissa 4 — Advanced Topics", title:"NFTs — deep dive", ready:true},
    {id:16, part:"Hissa 4 — Advanced Topics", title:"DAOs — governance", ready:true},
    {id:17, part:"Hissa 4 — Advanced Topics", title:"Layer 1 vs Layer 2", ready:true},
    {id:18, part:"Hissa 4 — Advanced Topics", title:"Cross-chain bridges", ready:true},
    {id:19, part:"Hissa 4 — Advanced Topics", title:"Security — attacks, audits", ready:true},
    {id:20, part:"Hissa 4 — Advanced Topics", title:"Identity aur Privacy", ready:true},
    {id:21, part:"Hissa 4 — Advanced Topics", title:"Web3 Gaming aur Metaverse", ready:true},
    {id:22, part:"Hissa 4 — Advanced Topics", title:"Regulation aur future trends", ready:true},
    {id:23, part:"Hissa 5 — Practical", title:"Apna pehla DApp banayein", ready:true}
  ];

  var CONTENT = {};

  CONTENT[1] = {
    kicker:"Hissa 1 — Bunyad",
    title:"Introduction: Web 1.0 se Web 3.0 tak ka safar",
    next:"Decentralization ka concept aur ye kaam kaise karta hai",
    html: [
      '<p>Jab bhi hum "internet" ka lafz sunte hain, hum sochte hain ke ye hamesha se aisa hi tha — websites, apps, social media, sab kuch ek click par. Lekin haqeeqat ye hai ke internet ek static, jama-shuda cheez nahi — ye teen bare daur (eras) se guzra hai, aur har daur ne ye badla hai ke hum internet kaise istemal karte hain, aur sab se zaroori baat — <strong>data aur power kis ke paas hoti hai.</strong></p>',
      '<p>Ye teen daur hain: <strong>Web 1.0</strong>, <strong>Web 2.0</strong>, aur <strong>Web 3.0</strong>. Is chapter mein hum teenon ko samjhenge, taake is poori kitaab ka bunyadi context clear ho jaye — kyunke Web 3.0 ki har cheez, chahe wo blockchain ho ya smart contracts, isi bunyadi tabdeeli se shuru hoti hai.</p>',

      '<div class="diagram"><svg viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg">'
        + '<line x1="90" y1="120" x2="810" y2="120" stroke="var(--line)" stroke-width="2"/>'
        + '<line x1="700" y1="120" x2="810" y2="120" stroke="var(--brass)" stroke-width="2" stroke-dasharray="4 6"/>'
        + '<polygon points="810,120 796,113 796,127" fill="var(--brass)"/>'

        + '<circle cx="150" cy="120" r="13" fill="#9C8C6A"/>'
        + '<text x="150" y="75" text-anchor="middle" class="d-title" font-size="17">Web 1.0</text>'
        + '<text x="150" y="94" text-anchor="middle" class="d-sub" font-size="12">1991 – 2004</text>'
        + '<text x="150" y="160" text-anchor="middle" class="d-tag" font-size="12.5">Read-Only</text>'
        + '<text x="150" y="178" text-anchor="middle" class="d-sub" font-size="11.5">sirf parhna</text>'

        + '<circle cx="450" cy="120" r="13" fill="var(--teal)"/>'
        + '<text x="450" y="75" text-anchor="middle" class="d-title" font-size="17">Web 2.0</text>'
        + '<text x="450" y="94" text-anchor="middle" class="d-sub" font-size="12">2004 – ab tak</text>'
        + '<text x="450" y="160" text-anchor="middle" class="d-tag" font-size="12.5">Read-Write</text>'
        + '<text x="450" y="178" text-anchor="middle" class="d-sub" font-size="11.5">parhna + likhna (platform ka control)</text>'

        + '<circle cx="750" cy="120" r="14" fill="none" stroke="var(--brass)" stroke-width="2.5"/>'
        + '<circle cx="750" cy="120" r="6" fill="var(--brass)"/>'
        + '<text x="750" y="75" text-anchor="middle" class="d-title" font-size="17">Web 3.0</text>'
        + '<text x="750" y="94" text-anchor="middle" class="d-sub" font-size="12">ubharta hua daur</text>'
        + '<text x="750" y="160" text-anchor="middle" class="d-tag" font-size="12.5">Read-Write-Own</text>'
        + '<text x="750" y="178" text-anchor="middle" class="d-sub" font-size="11.5">parhna + likhna + malik hona</text>'
        + '</svg><div class="diagram-cap">Diagram 1.1 — Internet ke teen daur, aur teesra daur jo abhi ban raha hai</div></div>',

      '<h2>Web 1.0 — "Read-Only Web" (1991–2004)</h2>',
      '<p>Internet ke shuruati saalon mein websites simple, static HTML pages hoti thi. Koi comment nahi, koi like button nahi, koi user account nahi. Ek company ya individual content publish karta tha, aur baqi sab log sirf usay <strong>parhte</strong> the — jaise ek digital magazine.</p>',
      '<ul>'
        + '<li>Static pages, bohat kam interactivity</li>'
        + '<li>User accounts ya profiles aam nahi the</li>'
        + '<li>Communication one-way thi — publisher se reader tak</li>'
        + '<li>Websites banane ke liye technical knowledge chahiye hoti thi, is liye publish karne wale log kam the</li>'
      + '</ul>',

        + '<rect x="60" y="500" width="580" height="78" rx="6" fill="var(--page-bg)" stroke="var(--teal)" stroke-width="1.8"/>'
        + '<circle cx="102" cy="539" r="16" fill="var(--teal)"/><text x="102" y="544" text-anchor="middle" font-family="var(--font-mono)" font-size="14" fill="#F6F1E4">5</text>'
        + '<text x="134" y="530" class="d-title" font-size="14.5">Poora DApp live hai!</text>'
        + '<text x="134" y="552" class="d-sub" font-size="12">Browser mein khol kar istemal ho sakta hai</text>'
        + '</svg><div class="diagram-cap">Diagram 23.1 — Piggy Bank DApp: idea se lekar live tak</div></div>',

      '<h2>index.html</h2>',
      '<div class="code-block"><pre><span class="cm">&lt;!-- Simple Piggy Bank DApp ka UI --&gt;</span>\n'
        + '<span class="kw">&lt;!DOCTYPE html&gt;</span>\n'
        + '<span class="kw">&lt;html&gt;</span>\n'
        + '<span class="kw">&lt;head&gt;&lt;title&gt;</span>Piggy Bank DApp<span class="kw">&lt;/title&gt;&lt;/head&gt;</span>\n'
        + '<span class="kw">&lt;body&gt;</span>\n'
        + '  <span class="kw">&lt;h1&gt;</span>Meri Piggy Bank<span class="kw">&lt;/h1&gt;</span>\n'
        + '  <span class="kw">&lt;button id=</span><span class="ty">"connectBtn"</span><span class="kw">&gt;</span>Wallet Connect Karein<span class="kw">&lt;/button&gt;</span>\n'
        + '  <span class="kw">&lt;p&gt;</span>Balance: <span class="kw">&lt;span id=</span><span class="ty">"balance"</span><span class="kw">&gt;</span>--<span class="kw">&lt;/span&gt;</span> ETH<span class="kw">&lt;/p&gt;</span>\n\n'
        + '  <span class="kw">&lt;input id=</span><span class="ty">"depositAmount"</span> <span class="kw">placeholder=</span><span class="ty">"Amount (ETH)"</span> <span class="kw">/&gt;</span>\n'
        + '  <span class="kw">&lt;button id=</span><span class="ty">"depositBtn"</span><span class="kw">&gt;</span>Deposit Karein<span class="kw">&lt;/button&gt;</span>\n\n'
        + '  <span class="kw">&lt;input id=</span><span class="ty">"withdrawAmount"</span> <span class="kw">placeholder=</span><span class="ty">"Amount (ETH)"</span> <span class="kw">/&gt;</span>\n'
        + '  <span class="kw">&lt;button id=</span><span class="ty">"withdrawBtn"</span><span class="kw">&gt;</span>Withdraw Karein<span class="kw">&lt;/button&gt;</span>\n\n'
        + '  <span class="kw">&lt;script src=</span><span class="ty">"app.js"</span><span class="kw">&gt;&lt;/script&gt;</span>\n'
        + '<span class="kw">&lt;/body&gt;</span>\n'
        + '<span class="kw">&lt;/html&gt;</span></pre></div>',
      '<div class="code-cap">index.html — poora UI: connect button, balance, deposit/withdraw forms</div>',

      '<h2>app.js</h2>',
      '<div class="code-block"><pre><span class="kw">import</span> { ethers } <span class="kw">from</span> <span class="ty">"ethers"</span>;\n\n'
        + '<span class="kw">const</span> contractAddress = <span class="ty">"0xYourContractAddress"</span>;\n'
        + '<span class="kw">const</span> abi = [\n'
        + '  <span class="ty">"function balance() view returns (uint256)"</span>,\n'
        + '  <span class="ty">"function deposit() payable"</span>,\n'
        + '  <span class="ty">"function withdraw(uint amount)"</span>\n'
        + '];\n\n'
        + '<span class="kw">let</span> signer, contract;\n\n'
        + '<span class="cm">// Wallet connect</span>\n'
        + 'document.getElementById(<span class="ty">"connectBtn"</span>).onclick = <span class="kw">async</span> () =&gt; {\n'
        + '  <span class="kw">await</span> window.ethereum.request({ method: <span class="ty">"eth_requestAccounts"</span> });\n'
        + '  <span class="kw">const</span> provider = <span class="kw">new</span> ethers.BrowserProvider(window.ethereum);\n'
        + '  signer = <span class="kw">await</span> provider.getSigner();\n'
        + '  contract = <span class="kw">new</span> ethers.Contract(contractAddress, abi, signer);\n'
        + '  updateBalance();\n'
        + '};\n\n'
        + '<span class="cm">// Balance parhna (Read)</span>\n'
        + '<span class="kw">async function</span> updateBalance() {\n'
        + '  <span class="kw">const</span> bal = <span class="kw">await</span> contract.balance();\n'
        + '  document.getElementById(<span class="ty">"balance"</span>).innerText = ethers.formatEther(bal);\n'
        + '}\n\n'
        + '<span class="cm">// Deposit karna (Write)</span>\n'
        + 'document.getElementById(<span class="ty">"depositBtn"</span>).onclick = <span class="kw">async</span> () =&gt; {\n'
        + '  <span class="kw">const</span> amount = document.getElementById(<span class="ty">"depositAmount"</span>).value;\n'
        + '  <span class="kw">const</span> tx = <span class="kw">await</span> contract.deposit({ value: ethers.parseEther(amount) });\n'
        + '  <span class="kw">await</span> tx.wait();\n'
        + '  updateBalance();\n'
        + '};\n\n'
        + '<span class="cm">// Withdraw karna (Write)</span>\n'
        + 'document.getElementById(<span class="ty">"withdrawBtn"</span>).onclick = <span class="kw">async</span> () =&gt; {\n'
        + '  <span class="kw">const</span> amount = document.getElementById(<span class="ty">"withdrawAmount"</span>).value;\n'
        + '  <span class="kw">const</span> tx = <span class="kw">await</span> contract.withdraw(ethers.parseEther(amount));\n'
        + '  <span class="kw">await</span> tx.wait();\n'
        + '  updateBalance();\n'
        + '};</pre></div>',
      '<div class="code-cap">app.js — wallet connect + read + write, sab ek jagah</div>',

      '<p>Ghor karein ke ye code Chapter 11 mein seekhe hue har hisse ko istemal karta hai: <code>window.ethereum</code> se connect (Chapter 11), ABI se contract banana (Chapter 11), aur read (<code>balance()</code>) vs write (<code>deposit()</code>, <code>withdraw()</code>) ka farq (Chapter 10) — sab ek chhoti, asal application mein.</p>',

      '<h2>Testnet par Test Karein — real paisa risk mein na daalein</h2>',
      '<p>Mainnet par jaane se pehle, hamesha ek <strong>Testnet</strong> (jaise Sepolia) par apna contract deploy aur test karein. Testnets par "faucets" se free, fake ETH milta hai — taake aap bina real paisa risk mein daale, apna poora DApp test kar sakein.</p>',

      '<div class="box"><div class="box-label">Yahan se aage kahan jayein?</div><ul>'
        + '<li>Solidity ko gehrai se seekhein (official documentation se)</li>'
        + '<li>Hardhat ya Foundry jaise professional development frameworks seekhein</li>'
        + '<li>Complex DApps banayein — DeFi (Chapter 14), NFT marketplace (Chapter 15), waghera</li>'
        + '<li>Mainnet par launch karne se pehle hamesha security audit karayein (Chapter 19 yaad karein)</li>'
      + '</ul></div>',

      '<div class="book-complete">'
        + '<div class="glyph">&#127881;</div>'
        + '<h3>Mubarak ho — kitaab mukammal hui!</h3>'
        + '<p>Aap ne is kitaab mein Web3 ka poora safar tay kiya — Web 1.0 se le kar apna pehla working DApp banane tak. Blockchain ki bunyad, cryptography, wallets, smart contracts, DeFi, NFTs, DAOs, scaling, aur security — ab aap ke paas is tezi se badalte hue field mein aage barhne ke liye ek mazboot bunyad hai. Seekhte rahein, ehtiyat rakhein, aur banate rahein.</p>'
      + '</div>'
    ].join('')
  };

  // ---------- render sidebar ----------
  var toc = document.getElementById('toc');
  var lastPart = null;
  CHAPTERS.forEach(function(ch){
    if(ch.part !== lastPart){
      var h = document.createElement('div');
      h.className = 'part-heading';
      h.textContent = ch.part;
      toc.appendChild(h);
      lastPart = ch.part;
    }
    var btn = document.createElement('button');
    btn.className = 'chapter-link' + (ch.ready ? '' : ' locked');
    btn.setAttribute('data-id', ch.id);
    btn.innerHTML = '<span class="num">' + String(ch.id).padStart(2,'0') + '</span><span>' + ch.title + '</span>';
    btn.addEventListener('click', function(){ openChapter(ch.id); closeDrawer(); });
    toc.appendChild(btn);
  });

  var readyCount = CHAPTERS.filter(function(c){return c.ready;}).length;
  document.getElementById('progress-text').textContent = readyCount + ' / ' + CHAPTERS.length + ' chapters';
  document.getElementById('progress-fill').style.width = Math.round((readyCount / CHAPTERS.length) * 100) + '%';

  // ---------- render page ----------
  var pageEl = document.getElementById('page');
  var topbarTitle = document.getElementById('topbarTitle');

  function openChapter(id){
    var meta = CHAPTERS.find(function(c){return c.id === id;});
    if(!meta) return;

    document.querySelectorAll('.chapter-link').forEach(function(el){
      el.classList.toggle('active', parseInt(el.getAttribute('data-id'),10) === id);
    });
    topbarTitle.textContent = String(id).padStart(2,'0') + '. ' + meta.title;

    if(meta.ready && CONTENT[id]){
      var c = CONTENT[id];
      pageEl.innerHTML =
        '<span class="chip">' + c.kicker + '</span>'
        + '<div class="chapter-head"><div class="chapter-num">' + String(id).padStart(2,'0') + '</div>'
        + '<div class="chapter-titles"><h1>' + c.title + '</h1></div></div>'
        + '<hr class="rule">'
        + '<article class="chapter">' + c.html + '</article>';
    } else {
      pageEl.innerHTML =
        '<div class="placeholder-view">'
        + '<div class="pnum">' + String(id).padStart(2,'0') + '</div>'
        + '<h1>' + meta.title + '</h1>'
        + '<p>Ye chapter jald likha jayega. Filhal Chapter 1 se shuru karein — kitaab step-by-step aage barh rahi hai.</p>'
        + '</div>';
    }

    pageEl.scrollTop = 0;
    window.scrollTo(0,0);
    try{ localStorage.setItem('web3book_last_chapter', String(id)); }catch(e){}
  }

  // ---------- mobile drawer ----------
  var spine = document.getElementById('spine');
  var overlay = document.getElementById('overlay');
  document.getElementById('menuBtn').addEventListener('click', function(){
    spine.classList.add('open'); overlay.classList.add('open');
  });
  overlay.addEventListener('click', closeDrawer);
  function closeDrawer(){
    spine.classList.remove('open'); overlay.classList.remove('open');
  }

  // ---------- initial chapter ----------
  var startId = 1;
  try{
    var saved = parseInt(localStorage.getItem('web3book_last_chapter'), 10);
    var savedMeta = CHAPTERS.find(function(c){return c.id === saved;});
    if(savedMeta && savedMeta.ready) startId = saved;
  }catch(e){}
  openChapter(startId);
})();
</script>
</body>
</html>

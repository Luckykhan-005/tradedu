<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" dir="rtl">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad5)"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#b8860b" font-family="Arial" font-size="26" font-weight="bold">کینڈل اسٹک پیٹرنز</text>
  <text x="450" y="62" text-anchor="middle" fill="#888" font-family="Arial" font-size="13">Candlestick Patterns — Important Shapes</text>
  
  <!-- Green Candle Label -->
  <text x="150" y="100" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="16" font-weight="bold">سبز کینڈل (Bullish)</text>
  <text x="150" y="118" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Close > Open = قیمت بڑھی</text>
  
  <!-- Green Candle -->
  <line x1="150" y1="140" x2="150" y2="250" stroke="#00b894" stroke-width="3"/>
  <rect x="130" y="170" width="40" height="60" fill="#00b894" rx="2"/>
  <text x="150" y="160" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="10">High</text>
  <text x="150" y="270" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="10">Low</text>
  <text x="115" y="180" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="9">Open</text>
  <text x="115" y="225" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="9">Close</text>
  
  <!-- Red Candle Label -->
  <text x="350" y="100" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="16" font-weight="bold">سرخ کینڈل (Bearish)</text>
  <text x="350" y="118" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Close < Open = قیمت گری</text>
  
  <!-- Red Candle -->
  <line x1="350" y1="140" x2="350" y2="250" stroke="#e74c3c" stroke-width="3"/>
  <rect x="330" y="180" width="40" height="50" fill="#e74c3c" rx="2"/>
  <text x="350" y="160" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="10">High</text>
  <text x="350" y="270" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="10">Low</text>
  <text x="315" y="190" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="9">Open</text>
  <text x="315" y="225" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="9">Close</text>
  
  <!-- Doji Label -->
  <text x="550" y="100" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="16" font-weight="bold">Doji</text>
  <text x="550" y="118" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Open = Close = تساوی</text>
  
  <!-- Doji Candle -->
  <line x1="550" y1="140" x2="550" y2="250" stroke="#fdcb6e" stroke-width="3"/>
  <line x1="530" y1="195" x2="570" y2="195" stroke="#fdcb6e" stroke-width="4"/>
  <text x="550" y="160" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="10">High</text>
  <text x="550" y="270" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="10">Low</text>
  
  <!-- Hammer Label -->
  <text x="750" y="100" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="16" font-weight="bold">Hammer</text>
  <text x="750" y="118" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Bottom par = Bullish</text>
  
  <!-- Hammer Candle -->
  <line x1="750" y1="140" x2="750" y2="250" stroke="#74b9ff" stroke-width="3"/>
  <rect x="735" y="150" width="30" height="25" fill="#74b9ff" rx="2"/>
  <text x="750" y="135" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="10">High</text>
  <text x="750" y="265" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="10">Low</text>
  
  <!-- Patterns Section -->
  <text x="450" y="310" text-anchor="middle" fill="#b8860b" font-family="Arial" font-size="20" font-weight="bold">اہم پیٹرنز</text>
  
  <!-- Pattern 1: Engulfing -->
  <rect x="50" y="330" width="180" height="140" rx="10" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="140" y="355" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="14" font-weight="bold">Bullish Engulfing</text>
  <text x="140" y="380" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">چھوٹی سرخ + بڑی سبز</text>
  <text x="140" y="405" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="12">Signal: BUY</text>
  <text x="140" y="430" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">جب سبز سرخ ko cover kre</text>
  <text x="140" y="450" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Bottom par = Strong Signal</text>
  
  <!-- Pattern 2: Shooting Star -->
  <rect x="260" y="330" width="180" height="140" rx="10" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="350" y="355" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="14" font-weight="bold">Shooting Star</text>
  <text x="350" y="380" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Chhoti body + Lambi upper wick</text>
  <text x="350" y="405" text-anchor="middle" fill="#ff7675" font-family="Arial" font-size="12">Signal: SELL</text>
  <text x="350" y="430" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Top par = Bearish Signal</text>
  <text x="350" y="450" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Buyers ne try kiya magar haar gaye</text>
  
  <!-- Pattern 3: Morning Star -->
  <rect x="470" y="330" width="180" height="140" rx="10" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="560" y="355" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="14" font-weight="bold">Morning Star</text>
  <text x="560" y="380" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">3 candles pattern</text>
  <text x="560" y="405" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="12">Signal: STRONG BUY</text>
  <text x="560" y="430" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Surkh + Chhoti + Sabz bari</text>
  <text x="560" y="450" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Trend reversal ka signal</text>
  
  <!-- Pattern 4: Evening Star -->
  <rect x="680" y="330" width="180" height="140" rx="10" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="770" y="355" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="14" font-weight="bold">Evening Star</text>
  <text x="770" y="380" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">3 candles pattern</text>
  <text x="770" y="405" text-anchor="middle" fill="#ff7675" font-family="Arial" font-size="12">Signal: STRONG SELL</text>
  <text x="770" y="430" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Sabz + Chhoti + Surkh bari</text>
  <text x="770" y="450" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="10">Trend reversal ka signal</text>
</svg>
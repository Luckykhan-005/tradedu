<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" dir="rtl">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="550" fill="url(#bgGrad4)"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#b8860b" font-family="Arial" font-size="26" font-weight="bold">رِسک مینجمنٹ — 1% قاعدہ</text>
  <text x="400" y="62" text-anchor="middle" fill="#888" font-family="Arial" font-size="13">Risk Management — The 1% Rule</text>
  
  <!-- Formula Box -->
  <rect x="150" y="85" width="500" height="80" rx="12" fill="#2d3436" stroke="#b8860b" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" fill="#b8860b" font-family="Arial" font-size="18" font-weight="bold">فارمولا</text>
  <text x="400" y="145" text-anchor="middle" fill="white" font-family="Arial" font-size="16">Risk Amount = Account Balance × 1%</text>
  
  <!-- Example Box -->
  <rect x="50" y="190" width="340" height="120" rx="10" fill="#1a2e1a" stroke="#00b894" stroke-width="2"/>
  <text x="220" y="218" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="16" font-weight="bold">مثال: $10,000 Account</text>
  <text x="220" y="248" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14">Risk = $10,000 × 1%</text>
  <text x="220" y="278" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="18" font-weight="bold">= $100 per trade</text>
  
  <!-- Example Box 2 -->
  <rect x="410" y="190" width="340" height="120" rx="10" fill="#1a2e1a" stroke="#00b894" stroke-width="2"/>
  <text x="580" y="218" text-anchor="middle" fill="#00b894" font-family="Arial" font-size="16" font-weight="bold">مثال: $50,000 Account</text>
  <text x="580" y="248" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14">Risk = $50,000 × 1%</text>
  <text x="580" y="278" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="18" font-weight="bold">= $500 per trade</text>
  
  <!-- Position Size Formula -->
  <rect x="100" y="335" width="600" height="70" rx="10" fill="#6c5ce7" stroke="#5f27cd" stroke-width="2"/>
  <text x="400" y="360" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Position Size = Risk Amount ÷ Stop Loss (in pips)</text>
  <text x="400" y="385" text-anchor="middle" fill="#ddd" font-family="Arial" font-size="13">لوٹ سائز = رِسک کی رقم ÷ اسٹاپ لاس (پپس میں)</text>
  
  <!-- Risk Reward -->
  <rect x="50" y="425" width="220" height="100" rx="10" fill="#0984e3" stroke="#0773c5" stroke-width="2"/>
  <text x="160" y="455" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Risk:Reward</text>
  <text x="160" y="480" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="13">1:2 = Best</text>
  <text x="160" y="500" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="13">1:3 = Excellent</text>
  
  <!-- Max Daily Loss -->
  <rect x="290" y="425" width="220" height="100" rx="10" fill="#e74c3c" stroke="#d63031" stroke-width="2"/>
  <text x="400" y="455" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Max Daily Loss</text>
  <text x="400" y="480" text-anchor="middle" fill="#ff7675" font-family="Arial" font-size="13">Account का 5%</text>
  <text x="400" y="500" text-anchor="middle" fill="#ff7675" font-family="Arial" font-size="13">$10K = $500/day max</text>
  
  <!-- Max Drawdown -->
  <rect x="530" y="425" width="220" height="100" rx="10" fill="#e17055" stroke="#d63031" stroke-width="2"/>
  <text x="640" y="455" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Max Drawdown</text>
  <text x="640" y="480" text-anchor="middle" fill="#fab1a0" font-family="Arial" font-size="13">Account का 10%</text>
  <text x="640" y="500" text-anchor="middle" fill="#fab1a0" font-family="Arial" font-size="13">$10K = $1000 total</text>
  
  <!-- Bottom Rule -->
  <rect x="150" y="535" width="500" height="12" rx="6" fill="#b8860b"/>
</svg>
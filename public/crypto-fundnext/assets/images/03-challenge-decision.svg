<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" dir="rtl">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgGrad3)"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#b8860b" font-family="Arial" font-size="26" font-weight="bold">کون سا چیلنج آپ کے لیے ہے؟</text>
  <text x="450" y="62" text-anchor="middle" fill="#888" font-family="Arial" font-size="13">Which Challenge Is Right For You? — Decision Tree</text>
  
  <!-- Start -->
  <ellipse cx="450" cy="100" rx="120" ry="35" fill="#b8860b"/>
  <text x="450" y="107" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">شروع کریں</text>
  
  <!-- Arrow down -->
  <line x1="450" y1="135" x2="450" y2="170" stroke="#b8860b" stroke-width="3" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#b8860b"/>
    </marker>
  </defs>
  
  <!-- Question 1 -->
  <rect x="325" y="175" width="250" height="50" rx="25" fill="#6c5ce7" stroke="#5f27cd" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" fill="white" font-family="Arial" font-size="14">کیا آپ beginner ہیں؟</text>
  
  <!-- Yes - Left -->
  <line x1="325" y1="200" x2="200" y2="200" stroke="#00b894" stroke-width="2"/>
  <line x1="200" y1="200" x2="200" y2="250" stroke="#00b894" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="260" y="195" fill="#00b894" font-family="Arial" font-size="12" font-weight="bold">ہاں</text>
  
  <!-- No - Right -->
  <line x1="575" y1="200" x2="700" y2="200" stroke="#e74c3c" stroke-width="2"/>
  <line x1="700" y1="200" x2="700" y2="250" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="640" y="195" fill="#e74c3c" font-family="Arial" font-size="12" font-weight="bold">نہیں</text>
  
  <!-- Beginner Path -->
  <rect x="100" y="255" width="200" height="45" rx="10" fill="#00b894" stroke="#00a381" stroke-width="2"/>
  <text x="200" y="283" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Stellar Lite ($52 سے)</text>
  
  <!-- Arrow down from Lite -->
  <line x1="200" y1="300" x2="200" y2="330" stroke="#00b894" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Lite Result -->
  <rect x="80" y="335" width="240" height="60" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="200" y="358" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="12" font-weight="bold">8% + 4% Target</text>
  <text x="200" y="378" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">کم فیس، آسان چیلنج</text>
  
  <!-- Experienced Path -->
  <rect x="600" y="255" width="200" height="45" rx="10" fill="#e74c3c" stroke="#d63031" stroke-width="2"/>
  <text x="700" y="283" text-anchor="middle" fill="white" font-family="Arial" font-size="13">کیا اپنا پیسہ ہے؟</text>
  
  <!-- Yes - Left from Experienced -->
  <line x1="600" y1="277" x2="520" y2="277" stroke="#00b894" stroke-width="2"/>
  <line x1="520" y1="277" x2="520" y2="330" stroke="#00b894" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="560" y="272" fill="#00b894" font-family="Arial" font-size="11">ہاں</text>
  
  <!-- No - Right from Experienced -->
  <line x1="800" y1="277" x2="850" y2="277" stroke="#e74c3c" stroke-width="2"/>
  <line x1="850" y1="277" x2="850" y2="330" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="825" y="272" fill="#e74c3c" font-family="Arial" font-size="11">نہیں</text>
  
  <!-- Has Money Path -->
  <rect x="420" y="335" width="200" height="45" rx="10" fill="#0984e3" stroke="#0773c5" stroke-width="2"/>
  <text x="520" y="363" text-anchor="middle" fill="white" font-family="Arial" font-size="13">Stellar 2-Step</text>
  
  <!-- No Money Path -->
  <rect x="750" y="335" width="150" height="45" rx="10" fill="#fdcb6e" stroke="#f39c12" stroke-width="2"/>
  <text x="825" y="363" text-anchor="middle" fill="#1a1a2e" font-family="Arial" font-size="13">Stellar 1-Step</text>
  
  <!-- Results -->
  <rect x="420" y="395" width="200" height="60" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="520" y="418" text-anchor="middle" fill="#74b9ff" font-family="Arial" font-size="12" font-weight="bold">8% + 5% Target</text>
  <text x="520" y="438" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Best Value — Fee wapas</text>
  
  <rect x="750" y="395" width="150" height="60" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="1"/>
  <text x="825" y="418" text-anchor="middle" fill="#fdcb6e" font-family="Arial" font-size="12" font-weight="bold">10% Target</text>
  <text x="825" y="438" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="11">Tez shuru</text>
  
  <!-- Futures Box -->
  <rect x="300" y="480" width="300" height="50" rx="10" fill="#e17055" stroke="#d63031" stroke-width="2"/>
  <text x="450" y="510" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">Futures Trader? → Flex ($134 se)</text>
  
  <!-- Arrow from main to futures -->
  <line x1="450" y1="445" x2="450" y2="480" stroke="#e17055" stroke-width="2" marker-end="url(#arrowhead2)"/>
  
  <!-- Bottom Note -->
  <text x="450" y="570" text-anchor="middle" fill="#636e72" font-family="Arial" font-size="11">FundedNext — Sab se Best Prop Firm | 95% Profit Share</text>
</svg>
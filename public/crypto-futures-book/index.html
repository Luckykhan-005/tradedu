const toc = document.getElementById("toc");
parts.forEach((part, pi)=>{
  const div = document.createElement("div");
  div.className = "part" + (pi===0 ? " open" : "");
  const head = document.createElement("div");
  head.className = "part-head";
  head.innerHTML = `<span>PART ${pi+1} — ${part.name}</span><span class="arrow">›</span>`;
  head.onclick = ()=> div.classList.toggle("open");
  const ul = document.createElement("ul");
  ul.className = "chapters";
  part.chapters.forEach((ch, ci)=>{
    const li = document.createElement("li");
    const available = !!(availableChapters[pi] && availableChapters[pi].includes(ci));

    li.onclick = ()=> available ? showChapter(pi,ci) : showToast();
    li.dataset.pi = pi; li.dataset.ci = ci;
    ul.appendChild(li);
  });
  div.appendChild(head); div.appendChild(ul);
  toc.appendChild(div);
});

function showToast(){
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

function markActive(pi,ci){
  document.querySelectorAll(".chapters li").forEach(li=>{
    li.classList.toggle("active", +li.dataset.pi===pi && +li.dataset.ci===ci);
  });
}

function showChapter(pi,ci){
  document.getElementById("chapterView").innerHTML = chapterData[`${pi}-${ci}`] || chapter_1_1;
  markActive(pi,ci);
  document.querySelector(".sidebar").classList.remove("open");
  window.scrollTo(0,0);

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#0b0e11"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#eaecef">FOMO &amp; Revenge Trading Cycle</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#848e9c">Account tab tak zinda hai jab tak cycle toot jaye</text>

  <!-- Cycle boxes -->
  <rect x="70" y="120" width="200" height="90" rx="12" fill="#161a1e" stroke="#f6465d" stroke-width="2"/>
  <text x="170" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#f6465d">1. FOMO</text>
  <text x="170" y="180" text-anchor="middle" font-size="13" fill="#848e9c">Bina plan ke entry</text>
  <text x="170" y="199" text-anchor="middle" font-size="13" fill="#848e9c">top par kharidna</text>

  <rect x="350" y="120" width="200" height="90" rx="12" fill="#161a1e" stroke="#f6465d" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#f6465d">2. Loss</text>
  <text x="450" y="180" text-anchor="middle" font-size="13" fill="#848e9c">Stop hit — paisa gaya</text>
  <text x="450" y="199" text-anchor="middle" font-size="13" fill="#848e9c">gussa + jazba</text>

  <rect x="630" y="120" width="200" height="90" rx="12" fill="#161a1e" stroke="#f6465d" stroke-width="2"/>
  <text x="730" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#f6465d">3. Revenge</text>
  <text x="730" y="180" text-anchor="middle" font-size="13" fill="#848e9c">Bade size se</text>
  <text x="730" y="199" text-anchor="middle" font-size="13" fill="#848e9c">wapas jeetna</text>

  <!-- Arrows -->
  <line x1="270" y1="165" x2="345" y2="165" stroke="#f6465d" stroke-width="2.5" marker-end="url(#arrR)"/>
  <line x1="550" y1="165" x2="625" y2="165" stroke="#f6465d" stroke-width="2.5" marker-end="url(#arrR)"/>

  <!-- Loop back arrow -->
  <path d="M 730 215 L 730 265 L 170 265 L 170 218" fill="none" stroke="#f6465d" stroke-width="2.5" marker-end="url(#arrR)"/>
  <text x="450" y="255" text-anchor="middle" font-size="14" font-weight="600" fill="#f6465d">aur bada loss → cycle dohrai</text>

  <!-- Break the cycle -->
  <text x="450" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#0ecb81">Cycle Torne Ke 4 Rules</text>

  <rect x="70" y="335" width="380" height="50" rx="10" fill="#0ecb81" fill-opacity="0.1"/>
  <text x="90" y="366" font-size="14" fill="#eaecef">✔ Trading plan likha hua ho (emotion se pehle)</text>

  <rect x="470" y="335" width="360" height="50" rx="10" fill="#0ecb81" fill-opacity="0.1"/>
  <text x="490" y="366" font-size="14" fill="#eaecef">✔ 2 losses ke baad break</text>

  <rect x="70" y="400" width="380" height="50" rx="10" fill="#0ecb81" fill-opacity="0.1"/>
  <text x="90" y="431" font-size="14" fill="#eaecef">✔ Daily loss limit: 2-3% account</text>

  <rect x="470" y="400" width="360" height="50" rx="10" fill="#0ecb81" fill-opacity="0.1"/>
  <text x="490" y="431" font-size="14" fill="#eaecef">✔ Journal mein har trade ka reason</text>

  <text x="450" y="480" text-anchor="middle" font-size="14" fill="#f0b90b">Plan rules se emotion control hota hai — emotion se nahi</text>

  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f6465d"/>
    </marker>
  </defs>
</svg>

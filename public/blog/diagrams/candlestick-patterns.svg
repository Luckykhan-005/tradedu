<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#0b0e11"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#eaecef">5 Candlestick Patterns Har Trader Ko Aane Chahiye</text>

  <!-- 1. Doji -->
  <g transform="translate(50,80)">
    <rect width="150" height="180" rx="12" fill="#161a1e" stroke="#2b3139" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#f0b90b">Doji</text>
    <line x1="75" y1="55" x2="75" y2="145" stroke="#848e9c" stroke-width="3"/>
    <rect x="55" y="96" width="40" height="8" fill="#848e9c"/>
    <text x="75" y="168" text-anchor="middle" font-size="11.5" fill="#848e9c">Open = Close</text>
    <text x="75" y="185" text-anchor="middle" font-size="11.5" fill="#eaecef">Faisla / reversal</text>
  </g>

  <!-- 2. Bullish Engulfing -->
  <g transform="translate(225,80)">
    <rect width="150" height="180" rx="12" fill="#161a1e" stroke="#2b3139" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0ecb81">Engulfing</text>
    <line x1="45" y1="70" x2="45" y2="130" stroke="#f6465d" stroke-width="2.5"/>
    <rect x="32" y="85" width="26" height="35" fill="#f6465d"/>
    <line x1="105" y1="55" x2="105" y2="145" stroke="#0ecb81" stroke-width="2.5"/>
    <rect x="85" y="65" width="40" height="75" fill="#0ecb81"/>
    <text x="75" y="168" text-anchor="middle" font-size="11.5" fill="#848e9c">Red ko green ne</text>
    <text x="75" y="185" text-anchor="middle" font-size="11.5" fill="#eaecef">nigal liya → up</text>
  </g>

  <!-- 3. Hammer -->
  <g transform="translate(400,80)">
    <rect width="150" height="180" rx="12" fill="#161a1e" stroke="#2b3139" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0ecb81">Hammer</text>
    <line x1="75" y1="55" x2="75" y2="130" stroke="#0ecb81" stroke-width="3"/>
    <rect x="55" y="55" width="40" height="26" fill="#0ecb81"/>
    <text x="75" y="168" text-anchor="middle" font-size="11.5" fill="#848e9c">Lambi wick neeche</text>
    <text x="75" y="185" text-anchor="middle" font-size="11.5" fill="#eaecef">gir kar wapas = up</text>
  </g>

  <!-- 4. Shooting Star -->
  <g transform="translate(575,80)">
    <rect width="150" height="180" rx="12" fill="#161a1e" stroke="#2b3139" stroke-width="2"/>
    <text x="75" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#f6465d">Shoot. Star</text>
    <line x1="75" y1="55" x2="75" y2="130" stroke="#f6465d" stroke-width="3"/>
    <rect x="55" y="112" width="40" height="26" fill="#f6465d"/>
    <text x="75" y="168" text-anchor="middle" font-size="11.5" fill="#848e9c">Lambi wick upar</text>
    <text x="75" y="185" text-anchor="middle" font-size="11.5" fill="#eaecef">chadh kar girna = down</text>
  </g>

  <!-- 5. Morning Star -->
  <g transform="translate(750,80)">
    <rect width="130" height="180" rx="12" fill="#161a1e" stroke="#2b3139" stroke-width="2"/>
    <text x="65" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0ecb81">Morning</text>
    <line x1="30" y1="55" x2="30" y2="145" stroke="#f6465d" stroke-width="2.5"/>
    <rect x="20" y="60" width="20" height="60" fill="#f6465d"/>
    <rect x="57" y="98" width="16" height="14" fill="#848e9c"/>
    <line x1="100" y1="55" x2="100" y2="145" stroke="#0ecb81" stroke-width="2.5"/>
    <rect x="90" y="75" width="20" height="65" fill="#0ecb81"/>
    <text x="65" y="168" text-anchor="middle" font-size="11.5" fill="#848e9c">3 kaindliyan</text>
    <text x="65" y="185" text-anchor="middle" font-size="11.5" fill="#eaecef">mazboot wapsi</text>
  </g>

  <!-- Rules bar -->
  <rect x="50" y="300" width="800" height="160" rx="14" fill="#161a1e" stroke="#f0b90b" stroke-width="2"/>
  <text x="450" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#f0b90b">Yaad Rakhein — Pattern Akela Trade Ka Reason Nahi</text>
  <text x="85" y="375" font-size="15" fill="#eaecef">1.  Hamesha trend + support/resistance ke sath confirm karein</text>
  <text x="85" y="405" font-size="15" fill="#eaecef">2.  Volume barha ho to signal strong</text>
  <text x="85" y="435" font-size="15" fill="#eaecef">3.  Agli kaindli ka close dekhein — jaldi entry se bachen</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#0b0e11"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#eaecef">Trading Journal — Kya Likhein?</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#848e9c">Har trade ke baad 2 minute — mahine mein pattern nazar aayega</text>

  <!-- Table header -->
  <rect x="50" y="105" width="800" height="44" rx="8" fill="#f0b90b"/>
  <text x="95" y="133" font-size="14" font-weight="700" fill="#0b0e11">Date</text>
  <text x="200" y="133" font-size="14" font-weight="700" fill="#0b0e11">Pair</text>
  <text x="320" y="133" font-size="14" font-weight="700" fill="#0b0e11">Setup</text>
  <text x="470" y="133" font-size="14" font-weight="700" fill="#0b0e11">R:R</text>
  <text x="555" y="133" font-size="14" font-weight="700" fill="#0b0e11">Result</text>
  <text x="670" y="133" font-size="14" font-weight="700" fill="#0b0e11">Emotion</text>

  <!-- Row 1 -->
  <rect x="50" y="153" width="800" height="44" fill="#161a1e"/>
  <text x="95" y="181" font-size="13.5" fill="#848e9c">24 Sep</text>
  <text x="200" y="181" font-size="13.5" fill="#eaecef">BTC/USDT</text>
  <text x="320" y="181" font-size="13.5" fill="#eaecef">Support bounce</text>
  <text x="470" y="181" font-size="13.5" fill="#eaecef">1:2</text>
  <text x="555" y="181" font-size="13.5" font-weight="700" fill="#0ecb81">+$42 (TP)</text>
  <text x="670" y="181" font-size="13.5" fill="#848e9c">Calm ✔</text>

  <!-- Row 2 -->
  <rect x="50" y="197" width="800" height="44" fill="#1a1f24"/>
  <text x="95" y="225" font-size="13.5" fill="#848e9c">24 Sep</text>
  <text x="200" y="225" font-size="13.5" fill="#eaecef">ETH/USDT</text>
  <text x="320" y="225" font-size="13.5" fill="#eaecef">Breakout</text>
  <text x="470" y="225" font-size="13.5" fill="#eaecef">1:1.5</text>
  <text x="555" y="225" font-size="13.5" font-weight="700" fill="#f6465d">-$10 (SL)</text>
  <text x="670" y="225" font-size="13.5" fill="#848e9c">OK — plan tha ✔</text>

  <!-- Row 3 -->
  <rect x="50" y="241" width="800" height="44" fill="#161a1e"/>
  <text x="95" y="269" font-size="13.5" fill="#848e9c">25 Sep</text>
  <text x="200" y="269" font-size="13.5" fill="#eaecef">SOL/USDT</text>
  <text x="320" y="269" font-size="13.5" fill="#f6465d">FOMO entry</text>
  <text x="470" y="269" font-size="13.5" fill="#848e9c">—</text>
  <text x="555" y="269" font-size="13.5" font-weight="700" fill="#f6465d">-$55</text>
  <text x="670" y="269" font-size="13.5" font-weight="700" fill="#f6465d">FOMO ✖</text>

  <!-- Insight box -->
  <rect x="50" y="315" width="390" height="145" rx="14" fill="#161a1e" stroke="#0ecb81" stroke-width="2"/>
  <text x="245" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#0ecb81">Review Mein Kya Milega</text>
  <text x="75" y="385" font-size="14" fill="#eaecef">✔ Kaunse setup profitable hain</text>
  <text x="75" y="413" font-size="14" fill="#eaecef">✔ Kis time achi trades hoti hain</text>
  <text x="75" y="441" font-size="14" fill="#eaecef">✔ Kaunsi ghalti bar bar dohrai</text>

  <rect x="470" y="315" width="380" height="145" rx="14" fill="#161a1e" stroke="#f0b90b" stroke-width="2"/>
  <text x="660" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#f0b90b">3 Zaroori Columns</text>
  <text x="495" y="385" font-size="14" fill="#eaecef">1. Trade ka reason (setup kya tha)</text>
  <text x="495" y="413" font-size="14" fill="#eaecef">2. Emotion (scared / FOMO / confident)</text>
  <text x="495" y="441" font-size="14" fill="#eaecef">3. Chart screenshot (entry wala)</text>

  <text x="450" y="485" text-anchor="middle" font-size="14" fill="#848e9c">Baghar journal ke wohi ghaltiyan bar bar — journal se progress dikhti hai</text>
</svg>

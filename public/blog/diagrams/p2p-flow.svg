<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="500" fill="#0b0e11"/>
  <text x="450" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#eaecef">Binance P2P — Order Kaise Lagta Hai</text>
  <text x="450" y="74" text-anchor="middle" font-size="15" fill="#848e9c">Escrow (hold) system aapki safety hai</text>

  <!-- Steps -->
  <g>
    <circle cx="120" cy="160" r="34" fill="#f0b90b"/>
    <text x="120" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0e11">1</text>
    <text x="120" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#eaecef">Order lagayein</text>
    <text x="120" y="243" text-anchor="middle" font-size="12" fill="#848e9c">Amount + seller</text>
  </g>
  <line x1="160" y1="160" x2="245" y2="160" stroke="#2b3139" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <circle cx="290" cy="160" r="34" fill="#f0b90b"/>
    <text x="290" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0e11">2</text>
    <text x="290" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#eaecef">Crypto HOLD</text>
    <text x="290" y="243" text-anchor="middle" font-size="12" fill="#848e9c">Escrow mein lock</text>
  </g>
  <line x1="330" y1="160" x2="415" y2="160" stroke="#2b3139" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <circle cx="460" cy="160" r="34" fill="#f0b90b"/>
    <text x="460" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0e11">3</text>
    <text x="460" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#eaecef">Payment karein</text>
    <text x="460" y="243" text-anchor="middle" font-size="12" fill="#848e9c">Bank / JazzCash</text>
  </g>
  <line x1="500" y1="160" x2="585" y2="160" stroke="#2b3139" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <circle cx="630" cy="160" r="34" fill="#f0b90b"/>
    <text x="630" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0e11">4</text>
    <text x="630" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#eaecef">Seller confirm</text>
    <text x="630" y="243" text-anchor="middle" font-size="12" fill="#848e9c">Screenshot dein</text>
  </g>
  <line x1="670" y1="160" x2="755" y2="160" stroke="#2b3139" stroke-width="3" marker-end="url(#arrG)"/>

  <g>
    <circle cx="800" cy="160" r="34" fill="#0ecb81"/>
    <text x="800" y="169" text-anchor="middle" font-size="22" font-weight="700" fill="#0b0e11">5</text>
    <text x="800" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#eaecef">Crypto milega</text>
    <text x="800" y="243" text-anchor="middle" font-size="12" fill="#848e9c">Wallet mein</text>
  </g>

  <!-- Safety rules -->
  <rect x="70" y="285" width="370" height="175" rx="14" fill="#161a1e" stroke="#f6465d" stroke-width="2"/>
  <text x="255" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#f6465d">Scam Se Bachein</text>
  <text x="95" y="350" font-size="14" fill="#eaecef">✖ Order ke BAHAR payment kabhi na karein</text>
  <text x="95" y="380" font-size="14" fill="#eaecef">✖ Fake payment screenshot se bachen</text>
  <text x="95" y="410" font-size="14" fill="#eaecef">✖ Bina confirm kiye crypto na chhorein</text>
  <text x="95" y="440" font-size="14" fill="#eaecef">✖ Low-rated sellers se deal na karein</text>

  <rect x="470" y="285" width="360" height="175" rx="14" fill="#161a1e" stroke="#0ecb81" stroke-width="2"/>
  <text x="650" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#0ecb81">Safe Rehne Ke Rules</text>
  <text x="495" y="350" font-size="14" fill="#eaecef">✔ Sirf order ke andar hi payment</text>
  <text x="495" y="380" font-size="14" fill="#eaecef">✔ Payment ki video recording rakhein</text>
  <text x="495" y="410" font-size="14" fill="#eaecef">✔ Bank app mein paisa khud verify karein</text>
  <text x="495" y="440" font-size="14" fill="#eaecef">✔ 500+ trades, 95%+ rating wale sellers</text>

  <defs>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#f0b90b"/>
    </marker>
  </defs>
</svg>
